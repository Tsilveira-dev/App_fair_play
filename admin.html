<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Fair Play | Painel do Gestor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: '#11119c',
            ink: '#202124',
            soft: '#F8F9FC',
            go: '#22C55E',
            sun: '#FACC15'
          }
        }
      }
    };
  </script>
  <style>
    :root {
      --brand: #11119c;
      --ink: #202124;
      --go: #22C55E;
      --sun: #FACC15;
      --soft: #F8F9FC;
      --line: #E5E7EB;
      --erro: #B91C1C;
      --erro-fundo: #FEF2F2;
    }
    body {
      font-family: 'Nunito Sans', system-ui, sans-serif;
      background: var(--soft);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    .font-display { font-family: 'Sora', 'Nunito Sans', system-ui, sans-serif; }
    :focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

    /* Estados */
    .oculto { display: none !important; }

    /* Cards */
    .cartao {
      background: #fff;
      border-radius: 1.5rem;
      box-shadow: 0 8px 30px rgba(17, 17, 156, 0.08);
    }

    /* Campos */
    .campo {
      width: 100%;
      border: 2px solid var(--line);
      border-radius: 1rem;
      padding: 0.75rem 1rem;
      background: #fff;
      color: var(--ink);
      font-size: 1rem;
      transition: border-color 0.2s;
    }
    .campo:focus { outline: none; border-color: var(--brand); }
    .campo.invalido { border-color: var(--erro); }

    /* Botões */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 1rem;
      padding: 0.85rem 1.5rem;
      font-family: 'Sora', sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 0.02em;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
    }
    .btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(17, 17, 156, 0.2); }
    .btn:active:not(:disabled) { transform: translateY(0); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-brand { background: var(--brand); color: #fff; width: 100%; }
    .btn-ghost { background: #fff; color: var(--ink); border-color: var(--line); }
    .btn-ghost:hover:not(:disabled) { box-shadow: none; border-color: var(--brand); transform: none; }
    .btn-pequeno { padding: 0.5rem 0.9rem; font-size: 0.8rem; border-radius: 0.75rem; }
    .btn-perigo { background: #fff; color: var(--erro); border-color: #FECACA; }
    .btn-header { background: transparent; color: #fff; border-color: rgba(255, 255, 255, 0.3); }
    .btn-header:hover:not(:disabled) { background: rgba(255, 255, 255, 0.1); box-shadow: none; transform: none; }

    /* Overlay e modal */
    .camada {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background: rgba(28, 28, 28, 0.4);
      backdrop-filter: blur(4px);
    }
    .camada-carregando { z-index: 50; }
    .camada-modal { z-index: 40; }

    /* Lista */
    .item-participante {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 1rem 0;
    }
    .item-participante + .item-participante { border-top: 1px solid var(--line); }
    .badge {
      display: inline-block;
      border-radius: 999px;
      padding: 0.2rem 0.7rem;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .badge-ativo { background: rgba(34, 197, 94, 0.15); color: #15803D; }
    .badge-inativo { background: #F3F4F6; color: #6B7280; }

    /* Mensagens de status */
    .status { border-radius: 1rem; padding: 0.85rem 1.1rem; font-size: 0.92rem; font-weight: 700; }
    .status-sucesso { background: rgba(34, 197, 94, 0.12); color: #15803D; }
    .status-erro { background: var(--erro-fundo); color: var(--erro); }
    .status-info { background: rgba(17, 17, 156, 0.07); color: var(--brand); }

    .texto-erro { margin-top: 0.4rem; font-size: 0.875rem; color: var(--erro); }
    .spinner {
      width: 1.25rem;
      height: 1.25rem;
      border: 2px solid var(--brand);
      border-top-color: transparent;
      border-radius: 50%;
      animation: girar 0.8s linear infinite;
    }
    @keyframes girar { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body class="min-h-screen antialiased">

  <!-- Overlay de carregamento global -->
  <div id="overlay-carregando" class="camada camada-carregando oculto" role="status" aria-live="polite">
    <div class="cartao flex items-center gap-3 px-6 py-4">
      <span class="spinner" aria-hidden="true"></span>
      <span class="font-semibold">Carregando...</span>
    </div>
  </div>

  <!-- Tela de login -->
  <section id="tela-login" class="flex min-h-screen items-center justify-center px-4 py-10">
    <div class="w-full max-w-md">
      <div class="mb-8 text-center">
        <p class="font-display text-3xl font-extrabold text-brand">Fair Play</p>
        <p class="mt-1 text-sm text-slate-500">Painel do gestor</p>
      </div>

      <div class="cartao p-6 sm:p-8">
        <h1 class="font-display text-xl font-bold">Entrar</h1>
        <p class="mt-1 text-sm text-slate-500">Use o e-mail e a senha cadastrados para o gestor.</p>

        <form id="form-login" class="mt-6 space-y-4" novalidate>
          <div>
            <label for="login-email" class="mb-1 block text-sm font-semibold">E-mail</label>
            <input id="login-email" name="email" type="email" class="campo" autocomplete="username" required maxlength="120">
          </div>
          <div>
            <label for="login-senha" class="mb-1 block text-sm font-semibold">Senha</label>
            <input id="login-senha" name="senha" type="password" class="campo" autocomplete="current-password" required maxlength="128">
          </div>

          <p id="login-erro" class="status status-erro oculto" role="alert"></p>

          <button id="btn-login" type="submit" class="btn btn-brand">Entrar</button>
        </form>
      </div>
    </div>
  </section>

  <!-- Área administrativa (liberada somente após verificação no servidor) -->
  <section id="tela-admin" class="oculto min-h-screen">
    <header class="bg-ink text-white">
      <div class="mx-auto flex max-w-6xl flex-col gap-3 px-4 py-4 sm:flex-row sm:items-center sm:justify-between">
        <div>
          <p class="font-display text-xl font-extrabold">Fair Play <span class="font-normal text-slate-300">| Gestão</span></p>
          <p id="admin-usuario" class="text-xs text-slate-300"></p>
        </div>
        <button id="btn-sair" type="button" class="btn btn-header btn-pequeno self-start sm:self-auto">Sair</button>
      </div>
    </header>

    <main class="mx-auto max-w-6xl space-y-6 px-4 py-6">

      <!-- Mensagem global de status -->
      <div id="status-global" class="status oculto" role="status" aria-live="polite"></div>

      <div class="grid gap-6 lg:grid-cols-3">

        <!-- Cadastro -->
        <section class="cartao h-fit p-6" aria-labelledby="titulo-cadastro">
          <h2 id="titulo-cadastro" class="font-display text-lg font-bold">Cadastrar participante</h2>
          <p class="mt-1 text-sm text-slate-500">Informe apenas o primeiro nome.</p>

          <form id="form-cadastro" class="mt-5 space-y-4" novalidate>
            <div>
              <label for="cadastro-nome" class="mb-1 block text-sm font-semibold">Primeiro nome</label>
              <input id="cadastro-nome" name="nome" type="text" class="campo" required minlength="2" maxlength="40" autocomplete="off">
              <p id="cadastro-erro" class="texto-erro oculto" role="alert"></p>
            </div>
            <button id="btn-cadastrar" type="submit" class="btn btn-brand">Cadastrar</button>
          </form>
        </section>

        <!-- Lista de participantes -->
        <section class="cartao p-6 lg:col-span-2" aria-labelledby="titulo-lista">
          <div class="flex flex-wrap items-center justify-between gap-3">
            <div>
              <h2 id="titulo-lista" class="font-display text-lg font-bold">Participantes</h2>
              <p id="contador-participantes" class="text-sm text-slate-500"></p>
            </div>
            <button id="btn-atualizar" type="button" class="btn btn-ghost btn-pequeno">Atualizar</button>
          </div>

          <p id="lista-mensagem" class="mt-4 text-sm text-slate-500 oculto"></p>

          <!-- Os itens são gerados pelo admin.js -->
          <ul id="lista-participantes" class="mt-4"></ul>
        </section>
      </div>
    </main>
  </section>

  <!-- Modal de edição de nome -->
  <div id="modal-editar" class="camada camada-modal oculto" role="dialog" aria-modal="true" aria-labelledby="titulo-editar">
    <div class="cartao w-full max-w-md p-6">
      <h2 id="titulo-editar" class="font-display text-lg font-bold">Corrigir nome</h2>
      <form id="form-editar" class="mt-5 space-y-4" novalidate>
        <input id="editar-id" type="hidden">
        <div>
          <label for="editar-nome" class="mb-1 block text-sm font-semibold">Primeiro nome</label>
          <input id="editar-nome" name="nome" type="text" class="campo" required minlength="2" maxlength="40" autocomplete="off">
          <p id="editar-erro" class="texto-erro oculto" role="alert"></p>
        </div>
        <div class="flex justify-end gap-3">
          <button id="btn-cancelar-edicao" type="button" class="btn btn-ghost btn-pequeno">Cancelar</button>
          <button id="btn-salvar-edicao" type="submit" class="btn btn-brand btn-pequeno" style="width:auto">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="admin.js"></script>
</body>
</html>
